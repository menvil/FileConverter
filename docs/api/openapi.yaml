openapi: 3.1.0
info:
  title: File Converter API
  version: 1.0.0
  description: API for uploading files, creating conversion jobs, checking status, and downloading results.
servers:
  - url: /api/v1
    description: Current host
paths:
  /converters:
    get:
      operationId: listConverters
      summary: List available converters
      description: Returns all currently supported source → target conversion capabilities.
      tags:
        - Converters
      responses:
        '200':
          description: List of converters.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Converter'
              example:
                data:
                  - key: png_to_jpg
                    source_format: png
                    target_format: jpg
                    label: PNG to JPG
                    description: Convert PNG images to JPG format.
                    recommended: true
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /converters/{source}/{target}/schema:
    get:
      operationId: getConverterSchema
      summary: Get converter options schema
      description: Returns the available conversion options for a given source → target pair.
      tags:
        - Converters
      parameters:
        - name: source
          in: path
          required: true
          schema:
            type: string
            example: png
        - name: target
          in: path
          required: true
          schema:
            type: string
            example: jpg
      responses:
        '200':
          description: Converter options schema.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConverterSchemaResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /files:
    post:
      operationId: uploadFile
      summary: Upload a file
      description: Uploads a supported file and returns detected format and metadata.
      tags:
        - Files
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: File uploaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /files/{file}/targets:
    get:
      operationId: listFileTargetFormats
      summary: List target formats for an uploaded file
      description: Returns available conversion target formats for the given uploaded file.
      tags:
        - Files
      parameters:
        - name: file
          in: path
          required: true
          schema:
            type: string
            example: file_01HX7abc
      responses:
        '200':
          description: Available target formats.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileTargetsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /conversions/estimate:
    post:
      operationId: estimateConversionCost
      summary: Estimate conversion credit cost
      description: Returns the estimated credit cost for a conversion without creating a job.
      tags:
        - Conversions
        - Credits
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstimateConversionRequest'
      responses:
        '200':
          description: Estimated credit cost.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/CreditCost'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /conversions:
    post:
      operationId: createConversion
      summary: Create a conversion job
      description: Creates a new conversion job. Credits are deducted on creation. Returns `422` with code `insufficient_credits` if balance is too low.
      tags:
        - Conversions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversionRequest'
      responses:
        '201':
          description: Conversion job created.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Conversion'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /conversions/{conversion}:
    get:
      operationId: getConversionStatus
      summary: Get conversion status
      description: "Returns the current status of a conversion job. Poll this endpoint until status is `completed` or `failed`."
      tags:
        - Conversions
      parameters:
        - name: conversion
          in: path
          required: true
          schema:
            type: string
            example: conv_01HX8abc
      responses:
        '200':
          description: Conversion status.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Conversion'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /conversions/{conversion}/download:
    get:
      operationId: downloadConversionResult
      summary: Download conversion result
      description: Downloads the result file for a completed conversion. Failed, processing, expired, or unauthorized conversions cannot be downloaded.
      tags:
        - Conversions
      parameters:
        - name: conversion
          in: path
          required: true
          schema:
            type: string
            example: conv_01HX8abc
      responses:
        '200':
          description: Result file binary.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '410':
          description: Result expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: result_expired
                  message: The conversion result has expired.
                  details: {}

  /credits/balance:
    get:
      operationId: getCreditsBalance
      summary: Get current credits balance
      description: Returns the current credits balance for the authenticated API key owner.
      tags:
        - Credits
      responses:
        '200':
          description: Current credits balance.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/CreditBalance'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

components:
  securitySchemes:
    ApiKeyBearer:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: "Use an API key generated in your account. Send it as `Authorization: Bearer <token>`. Example: `Authorization: Bearer fc_live_xxx`"

  schemas:
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorObject'

    ErrorObject:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: |
            Machine-readable error code. Known codes:
            - `unauthorized` — Missing or invalid API key.
            - `api_not_available` — API access is not available on your plan.
            - `unsupported_format` — File format is not supported.
            - `unsupported_conversion` — Source → target conversion is not supported.
            - `invalid_options` — Conversion options are invalid.
            - `file_too_large` — File exceeds allowed size.
            - `insufficient_credits` — Not enough credits to perform conversion.
            - `conversion_failed` — Conversion job failed.
            - `result_expired` — Conversion result has expired.
            - `rate_limited` — Too many requests.
          example: unsupported_conversion
        message:
          type: string
          example: PNG to MP3 is not supported.
        details:
          type: object
          additionalProperties: true
          example:
            source_format: png
            target_format: mp3

    Converter:
      type: object
      required:
        - key
        - source_format
        - target_format
        - label
        - description
      properties:
        key:
          type: string
          example: png_to_jpg
        source_format:
          type: string
          example: png
        target_format:
          type: string
          example: jpg
        label:
          type: string
          example: PNG to JPG
        description:
          type: string
          example: Convert PNG images to JPG format.
        recommended:
          type: boolean
          example: true

    ConverterSchemaResponse:
      type: object
      required:
        - source_format
        - target_format
        - options
      properties:
        source_format:
          type: string
          example: png
        target_format:
          type: string
          example: jpg
        options:
          type: array
          items:
            $ref: '#/components/schemas/OptionField'

    OptionField:
      type: object
      required:
        - key
        - type
        - label
      properties:
        key:
          type: string
          example: quality
        type:
          type: string
          enum: [select, segmented, toggle, color, number, range]
          example: segmented
        label:
          type: string
          example: Quality
        default:
          type: ['string', 'null']
          example: high
        options:
          type: array
          items:
            $ref: '#/components/schemas/OptionChoice'

    OptionChoice:
      type: object
      required:
        - value
        - label
      properties:
        value:
          type: string
          example: high
        label:
          type: string
          example: High

    FileResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/File'

    File:
      type: object
      required:
        - id
        - original_name
        - format
        - size_bytes
        - metadata
      properties:
        id:
          type: string
          example: file_01HX7abc
        original_name:
          type: string
          example: product-photo.png
        format:
          type: string
          example: png
        mime_type:
          type: string
          example: image/png
        size_bytes:
          type: integer
          example: 955000
        metadata:
          type: object
          additionalProperties: true
          example:
            width: 1200
            height: 900
            has_transparency: true

    FileTargetsResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - file_id
            - source_format
            - targets
          properties:
            file_id:
              type: string
              example: file_01HX7abc
            source_format:
              type: string
              example: png
            targets:
              type: array
              items:
                $ref: '#/components/schemas/TargetFormat'

    TargetFormat:
      type: object
      required:
        - format
        - label
        - description
      properties:
        format:
          type: string
          example: jpg
        label:
          type: string
          example: JPG
        description:
          type: string
          example: Best for photos and sharing.
        recommended:
          type: boolean
          example: true

    EstimateConversionRequest:
      type: object
      required:
        - file_id
        - target_format
      properties:
        file_id:
          type: string
          example: file_01HX7abc
        target_format:
          type: string
          example: jpg
        options:
          type: object
          additionalProperties: true
          example:
            quality: high
            background: '#ffffff'

    CreditCost:
      type: object
      required:
        - amount
        - breakdown
      properties:
        amount:
          type: integer
          example: 1
        unit:
          type: string
          example: credits
        breakdown:
          type: object
          additionalProperties: true
          example:
            base: 1
            size: 0
            features: 0
            total: 1

    CreateConversionRequest:
      type: object
      required:
        - file_id
        - target_format
      properties:
        file_id:
          type: string
          example: file_01HX7abc
        target_format:
          type: string
          example: jpg
        options:
          type: object
          additionalProperties: true
          example:
            quality: high
            background: '#ffffff'

    Conversion:
      type: object
      required:
        - id
        - status
        - source_format
        - target_format
        - credits
      properties:
        id:
          type: string
          example: conv_01HX8abc
        status:
          type: string
          enum: [queued, processing, completed, failed, cancelled, expired]
          example: queued
        source_format:
          type: string
          example: png
        target_format:
          type: string
          example: jpg
        progress:
          type: integer
          minimum: 0
          maximum: 100
          example: 0
        credits:
          $ref: '#/components/schemas/CreditCost'
        result_file:
          anyOf:
            - $ref: '#/components/schemas/File'
            - type: 'null'
        created_at:
          type: string
          format: date-time

    CreditBalance:
      type: object
      required:
        - balance
        - unit
      properties:
        balance:
          type: integer
          example: 948
        unit:
          type: string
          example: credits

  responses:
    UnauthorizedError:
      description: Missing or invalid API key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: unauthorized
              message: Missing or invalid API key.
              details: {}

    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: invalid_options
              message: The target_format field is required.
              details:
                target_format:
                  - The target_format field is required.

    NotFoundError:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: not_found
              message: The requested resource was not found.
              details: {}

security:
  - ApiKeyBearer: []
