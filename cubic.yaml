# Cubic.dev — only review release/* → main PRs.
# Cubic only supports ignore filters; we list every base/head pattern that
# is NOT release/* → main, so the remaining traffic is exactly that.
version: 1

reviews:
  ignore:
    # Skip any PR that does not target main.
    base_branches:
      - "develop"
      - "feature/*"
      - "chore/*"
      - "fix/*"
      - "hotfix/*"
      - "release/*"
    # Belt-and-braces: skip any PR sourced from a non-release branch
    # even if it somehow targets main. base_branches above is already
    # restrictive; this list catches additional head prefixes that might
    # be opened against main if branch protection is misconfigured.
    # Strict "release/* → main only" should be enforced by GitHub Branch
    # Protection rules on main as the source of truth.
    head_branches:
      - "feature/*"
      - "chore/*"
      - "fix/*"
      - "hotfix/*"
      - "spike/*"
      - "experiment/*"
      - "wip/*"
      - "tmp/*"
      - "draft/*"
      - "develop"
