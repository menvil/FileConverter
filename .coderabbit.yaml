# CodeRabbit — only auto-review release/* → main PRs.
# Strategy: auto-review runs only on PRs carrying the "release" label.
# The label is applied automatically by .github/workflows/label-release-prs.yml.
# Manual trigger is still available via @coderabbitai review.

language: en

reviews:
  profile: chill
  auto_review:
    enabled: true
    labels:
      - "release"
    base_branches:
      - "main"
    drafts: false
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true

chat:
  auto_reply: true
